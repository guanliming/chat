<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            overflow: hidden;
        }
        
        .chat-container {
            display: flex;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
        }
        
        .sidebar {
            width: 350px;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .sidebar-header h2 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .current-user {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }
        
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
        }
        
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .search-box {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        
        .search-box input:focus {
            border-color: #667eea;
        }
        
        .users-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .user-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f5f5f5;
        }
        
        .user-item:hover {
            background: #f8f9fa;
        }
        
        .user-item.active {
            background: #f0f2ff;
            border-left: 3px solid #667eea;
        }
        
        .user-item .avatar {
            width: 45px;
            height: 45px;
            background: #e0e0e0;
            color: #333;
            margin-right: 15px;
        }
        
        .user-item .user-details {
            flex: 1;
        }
        
        .user-item .username {
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }
        
        .user-item .status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .status-dot.online {
            background: #4caf50;
        }
        
        .status-dot.offline {
            background: #9e9e9e;
        }
        
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-header .avatar {
            width: 50px;
            height: 50px;
            background: #e0e0e0;
            color: #333;
        }
        
        .chat-header .chat-info h3 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .chat-header .chat-info .typing-status {
            font-size: 13px;
            color: #667eea;
            margin-top: 3px;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #fafbfc;
        }
        
        .welcome-message {
            text-align: center;
            color: #888;
            font-size: 16px;
            margin-top: 100px;
        }
        
        .message {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.sent {
            justify-content: flex-end;
        }
        
        .message.received {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 60%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .message.sent .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message.received .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }
        
        .message-time {
            font-size: 11px;
            color: #aaa;
            margin-top: 5px;
            text-align: right;
        }
        
        .message.sent .message-time {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .chat-input-container {
            padding: 20px 30px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .chat-input {
            flex: 1;
            padding: 15px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            resize: none;
            max-height: 100px;
        }
        
        .chat-input:focus {
            border-color: #667eea;
        }
        
        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .no-user-selected {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
            font-size: 18px;
        }
        
        .no-user-selected svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .unread-count {
            background: #ff5252;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>在线聊天</h2>
                <div class="current-user">
                    <div class="user-info">
                        <div class="avatar" id="currentUserAvatar">-</div>
                        <div>
                            <div id="currentUsername">加载中...</div>
                            <div style="font-size: 12px; opacity: 0.8;">在线</div>
                        </div>
                    </div>
                    <button class="logout-btn" onclick="logout()">退出登录</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索用户...">
            </div>
            <div class="users-list" id="usersList">
            </div>
        </div>
        
        <div class="chat-main">
            <div class="chat-header" id="chatHeader" style="display: none;">
                <div class="avatar" id="chatAvatar">-</div>
                <div class="chat-info">
                    <h3 id="chatUsername">-</h3>
                    <div class="typing-status" id="typingStatus"></div>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="no-user-selected" id="noUserSelected">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                    </svg>
                    <p>选择一个用户开始聊天</p>
                </div>
            </div>
            
            <div class="chat-input-container" id="chatInputContainer" style="display: none;">
                <div class="chat-input-wrapper">
                    <textarea 
                        class="chat-input" 
                        id="messageInput" 
                        placeholder="输入消息..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        let socket = null;
        let currentUserId = null;
        let selectedUserId = null;
        let users = [];
        let typingTimeout = null;

        async function init() {
            try {
                const response = await fetch('/api/current_user', { cache: 'no-cache' });
                const userData = await response.json();
                currentUserId = parseInt(userData.id);
                
                document.getElementById('currentUserAvatar').textContent = userData.username.charAt(0).toUpperCase();
                document.getElementById('currentUsername').textContent = userData.username;
                
                await loadUsers();
                connectSocket();
                setupEventListeners();
            } catch (error) {
                console.error('初始化失败:', error);
                window.location.href = '/login';
            }
        }

        function connectSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = io(`${protocol}//${window.location.host}`, {
                withCredentials: true
            });

            socket.on('connect', () => {
                console.log('已连接到服务器');
                socket.emit('join_user_room', { user_id: currentUserId });
            });

            socket.on('disconnect', () => {
                console.log('与服务器断开连接');
            });

            socket.on('new_message', (message) => {
                const msgSenderId = parseInt(message.sender_id);
                const msgRecipientId = parseInt(message.recipient_id);
                
                console.log('=== 收到实时消息 ===');
                console.log('消息ID:', message.id);
                console.log('发送者:', msgSenderId);
                console.log('接收者:', msgRecipientId);
                console.log('当前用户:', currentUserId);
                console.log('当前选中用户:', selectedUserId);
                
                const isRelevantToCurrentChat = selectedUserId !== null && 
                    ((msgSenderId === currentUserId && msgRecipientId === selectedUserId) ||
                     (msgSenderId === selectedUserId && msgRecipientId === currentUserId));
                
                console.log('与当前聊天相关:', isRelevantToCurrentChat);
                
                if (isRelevantToCurrentChat) {
                    appendMessage(message);
                    
                    if (msgSenderId === selectedUserId) {
                        markMessagesAsRead(selectedUserId);
                    }
                }
                
                updateUserUnreadCount(msgSenderId === currentUserId ? msgRecipientId : msgSenderId);
            });

            socket.on('user_status_changed', (data) => {
                updateUserStatus(data.user_id, data.is_online);
            });

            socket.on('user_typing', (data) => {
                if (data.user_id === selectedUserId) {
                    document.getElementById('typingStatus').textContent = '正在输入...';
                }
            });

            socket.on('user_stop_typing', (data) => {
                if (data.user_id === selectedUserId) {
                    document.getElementById('typingStatus').textContent = '';
                }
            });
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/users', { cache: 'no-cache' });
                const usersData = await response.json();
                users = usersData.map(user => ({
                    ...user,
                    id: parseInt(user.id)
                }));
                console.log('加载的用户列表:', users);
                renderUsersList();
            } catch (error) {
                console.error('加载用户失败:', error);
            }
        }

        function renderUsersList(filter = '') {
            const usersList = document.getElementById('usersList');
            const filteredUsers = users.filter(user => 
                user.username.toLowerCase().includes(filter.toLowerCase())
            );
            
            usersList.innerHTML = '';
            
            filteredUsers.forEach(user => {
                const userId = parseInt(user.id);
                const userItem = document.createElement('div');
                userItem.className = `user-item ${selectedUserId === userId ? 'active' : ''}`;
                userItem.dataset.userId = userId;
                
                const statusClass = user.is_online ? 'online' : 'offline';
                const statusText = user.is_online ? '在线' : '离线';
                
                userItem.innerHTML = `
                    <div class="avatar">${user.username.charAt(0).toUpperCase()}</div>
                    <div class="user-details">
                        <div class="username">${user.username}</div>
                        <div class="status">
                            <span class="status-dot ${statusClass}"></span>
                            ${statusText}
                        </div>
                    </div>
                    <span class="unread-count" data-unread="${userId}" style="display: none;">0</span>
                `;
                
                userItem.onclick = () => selectUser(userId);
                usersList.appendChild(userItem);
            });
        }

        function updateUserStatus(userId, isOnline) {
            const numericUserId = parseInt(userId);
            const user = users.find(u => u.id === numericUserId);
            if (user) {
                user.is_online = isOnline;
                
                const userItem = document.querySelector(`.user-item[data-user-id="${numericUserId}"]`);
                if (userItem) {
                    const statusDot = userItem.querySelector('.status-dot');
                    const statusText = userItem.querySelector('.status');
                    
                    statusDot.className = `status-dot ${isOnline ? 'online' : 'offline'}`;
                    statusText.innerHTML = `<span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>${isOnline ? '在线' : '离线'}`;
                }
            }
        }

        async function selectUser(userId) {
            const numericUserId = parseInt(userId);
            selectedUserId = numericUserId;
            
            console.log('选择用户:', numericUserId, '当前用户:', currentUserId);
            
            document.querySelectorAll('.user-item').forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.dataset.userId) === numericUserId) {
                    item.classList.add('active');
                }
            });
            
            const unreadEl = document.querySelector(`[data-unread="${numericUserId}"]`);
            if (unreadEl) {
                unreadEl.style.display = 'none';
                unreadEl.textContent = '0';
            }
            
            const user = users.find(u => u.id === numericUserId);
            if (user) {
                document.getElementById('chatAvatar').textContent = user.username.charAt(0).toUpperCase();
                document.getElementById('chatUsername').textContent = user.username;
            }
            
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('chatInputContainer').style.display = 'block';
            document.getElementById('noUserSelected').style.display = 'none';
            
            await loadMessages(numericUserId);
        }

        function isMessageBelongsToCurrentChat(message, chatPartnerId) {
            const msgSenderId = parseInt(message.sender_id);
            const msgRecipientId = parseInt(message.recipient_id);
            const currentId = parseInt(currentUserId);
            const partnerId = parseInt(chatPartnerId);
            
            const isRelevant = (
                (msgSenderId === currentId && msgRecipientId === partnerId) ||
                (msgSenderId === partnerId && msgRecipientId === currentId)
            );
            
            console.log('验证消息:', {
                msgId: message.id,
                sender: msgSenderId,
                recipient: msgRecipientId,
                currentUser: currentId,
                chatPartner: partnerId,
                isRelevant: isRelevant
            });
            
            return isRelevant;
        }

        async function loadMessages(userId) {
            const numericUserId = parseInt(userId);
            console.log('=== 加载消息 ===');
            console.log('当前用户ID:', currentUserId);
            console.log('聊天对象ID:', numericUserId);
            
            try {
                const url = `/api/messages/${numericUserId}?_t=${Date.now()}`;
                console.log('请求URL:', url);
                
                const response = await fetch(url, { 
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                });
                
                const messages = await response.json();
                console.log('API返回消息数量:', messages.length);
                
                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';
                
                let displayedCount = 0;
                messages.forEach(message => {
                    if (isMessageBelongsToCurrentChat(message, numericUserId)) {
                        appendMessage(message, false);
                        displayedCount++;
                    } else {
                        console.warn('⚠️ 过滤掉不相关的消息:', message);
                    }
                });
                
                console.log('实际显示消息数量:', displayedCount);
                scrollToBottom();
            } catch (error) {
                console.error('加载消息失败:', error);
            }
        }

        function appendMessage(message, animate = true) {
            const msgSenderId = parseInt(message.sender_id);
            const isSent = msgSenderId === currentUserId;
            
            console.log('appendMessage - 消息ID:', message.id, '发送者:', msgSenderId, '当前用户:', currentUserId, 'isSent:', isSent);
            
            const container = document.getElementById('messagesContainer');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${isSent ? 'sent' : 'received'}`;
            messageEl.dataset.messageId = message.id;
            
            if (!animate) messageEl.style.animation = 'none';
            
            const time = message.timestamp ? new Date(message.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
            
            messageEl.innerHTML = `
                <div class="message-content">
                    ${escapeHtml(message.content)}
                    <div class="message-time">${time} (ID:${message.id})</div>
                </div>
            `;
            
            container.appendChild(messageEl);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !selectedUserId || !socket) return;
            
            input.value = '';
            autoResizeTextarea(input);
            
            socket.emit('private_message', {
                recipient_id: selectedUserId,
                content: content
            });
        }

        function setupEventListeners() {
            const messageInput = document.getElementById('messageInput');
            
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            messageInput.addEventListener('input', () => {
                autoResizeTextarea(messageInput);
                handleTyping();
            });
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                renderUsersList(e.target.value);
            });
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
        }

        function handleTyping() {
            if (!socket || !selectedUserId) return;
            
            socket.emit('typing', { recipient_id: selectedUserId });
            
            if (typingTimeout) {
                clearTimeout(typingTimeout);
            }
            
            typingTimeout = setTimeout(() => {
                socket.emit('stop_typing', { recipient_id: selectedUserId });
            }, 1500);
        }

        async function markMessagesAsRead(userId) {
        }

        function updateUserUnreadCount(userId) {
            const numericUserId = parseInt(userId);
            if (numericUserId === selectedUserId) return;
            
            const unreadEl = document.querySelector(`[data-unread="${numericUserId}"]`);
            if (unreadEl) {
                const count = parseInt(unreadEl.textContent) || 0;
                unreadEl.textContent = count + 1;
                unreadEl.style.display = 'block';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function logout() {
            try {
                await fetch('/logout');
                window.location.href = '/login';
            } catch (error) {
                console.error('退出失败:', error);
                window.location.href = '/login';
            }
        }

        init();
    </script>
</body>
</html>
